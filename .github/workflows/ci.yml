name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Type check + Build ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            plugin:
              - 'plugin/**'
              - 'testing/**'
              - '.github/workflows/ci.yml'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.plugin == 'true'
        with:
          # Pinned: the committed plugin bundle must be byte-identical to a CI rebuild.
          bun-version: "1.3.10"

      - name: Install plugin dependencies
        if: steps.changes.outputs.plugin == 'true'
        working-directory: plugin
        run: npm ci

      - name: Type check
        if: steps.changes.outputs.plugin == 'true'
        working-directory: plugin
        run: bunx tsc --noEmit

      - name: Build bundle
        if: steps.changes.outputs.plugin == 'true'
        working-directory: plugin
        run: bun run build

      # The plugin installs straight from git, so the committed bundle must match the source.
      - name: Committed bundle is up to date
        if: steps.changes.outputs.plugin == 'true'
        run: git diff --exit-code -- plugin/dist/codexfi.js || (echo "plugin/dist/codexfi.js is stale — run 'cd plugin && npm run build' and commit it" && exit 1)

      - name: Validate plugin + marketplace manifests (JSON)
        if: steps.changes.outputs.plugin == 'true'
        run: |
          node -e 'for (const f of [".claude-plugin/marketplace.json","plugin/.claude-plugin/plugin.json","plugin/hooks/hooks.json"]) { JSON.parse(require("fs").readFileSync(f,"utf8")); console.log("ok", f); }'


      - name: Skip — no plugin changes
        if: steps.changes.outputs.plugin != 'true'
        run: echo "No plugin/testing changes detected — skipping build"

  # ── Unit + Integration tests ───────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            plugin:
              - 'plugin/**'
              - 'testing/**'
              - '.github/workflows/ci.yml'

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.plugin == 'true'
        with:
          # Pinned: the committed plugin bundle must be byte-identical to a CI rebuild.
          bun-version: "1.3.10"

      - name: Install plugin dependencies
        if: steps.changes.outputs.plugin == 'true'
        working-directory: plugin
        run: npm ci

      - name: Install test dependencies
        if: steps.changes.outputs.plugin == 'true'
        working-directory: testing
        run: bun install --frozen-lockfile

      - name: Build bundle (required by plugin-load integration test)
        if: steps.changes.outputs.plugin == 'true'
        working-directory: plugin
        run: bun run build

      - name: Run unit tests
        if: steps.changes.outputs.plugin == 'true'
        working-directory: testing
        run: bun test src/unit/

      - name: Run integration tests
        if: steps.changes.outputs.plugin == 'true'
        working-directory: testing
        run: bun test src/integration/

      - name: Skip — no plugin changes
        if: steps.changes.outputs.plugin != 'true'
        run: echo "No plugin/testing changes detected — skipping tests"

  # ── Status gate ────────────────────────────────────────────────────────────
  # Always runs and always reports a status to GitHub. This is the single
  # required check in branch protection. Build/Test are allowed to skip (e.g.
  # on release-please PRs that only touch package.json/CHANGELOG.md) without
  # blocking the merge — but they must not have actually failed.
  status:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Verify build and test passed or were skipped
        run: |
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "Build or Test failed — blocking merge"
            exit 1
          fi
          echo "CI passed (build: ${{ needs.build.result }}, test: ${{ needs.test.result }})"
